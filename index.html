<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozm Equal Pay</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        cozm: {
          teal: '#44919c',
          dark: '#38767f',
          soft: '#c7e5e9',
          ink: '#1d3642',
          fg: '#283a42',
          muted: '#5d6f75',
          danger: '#bd4040',
          bg: '#f2f5f5',
          surface: '#ffffff',
          success: '#2d8659',
          warn: '#c4880c',
        }
      },
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
      }
    }
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f2f5f5; color: #1d3642; margin: 0; }
  input, select, textarea { font-family: inherit; }
  .step-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .step-dot.active { background: #44919c; color: #fff; }
  .step-dot.done { background: #2d8659; color: #fff; }
  .step-dot.pending { background: #c7e5e9; color: #5d6f75; }
  .step-line { height: 2px; flex: 1; margin: 0 4px; }
  .step-line.done { background: #2d8659; }
  .step-line.pending { background: #c7e5e9; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .input-field { width: 100%; padding: 8px 12px; border: 1px solid #c7e5e9; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
  .input-field:focus { outline: none; border-color: #44919c; box-shadow: 0 0 0 3px rgba(68,145,156,0.15); }
  .btn-primary { background: #44919c; color: #fff; padding: 10px 24px; border-radius: 6px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: #38767f; }
  .btn-secondary { background: #fff; color: #44919c; padding: 10px 24px; border-radius: 6px; font-weight: 600; font-size: 14px; border: 1px solid #44919c; cursor: pointer; transition: all 0.2s; }
  .btn-secondary:hover { background: #c7e5e9; }
  .card { background: #fff; border-radius: 10px; border: 1px solid #e2eaec; padding: 24px; }
  label { font-size: 13px; font-weight: 500; color: #283a42; display: block; margin-bottom: 4px; }
  .section-title { font-size: 18px; font-weight: 700; color: #1d3642; margin-bottom: 16px; }
  .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2eaec; }
  .result-row:last-child { border-bottom: none; }
  .uplift-box { background: linear-gradient(135deg, #44919c 0%, #38767f 100%); color: #fff; border-radius: 10px; padding: 24px; text-align: center; }
  .comparison-bar { height: 24px; border-radius: 4px; position: relative; overflow: hidden; }
  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-cozm-bg">
  <div class="card w-full max-w-sm text-center fade-in">
    <img id="loginLogo" alt="The Cozm" class="mx-auto mb-6" style="height:56px;">
    <h1 class="text-xl font-bold text-cozm-ink mb-1">Equal Pay</h1>
    <p class="text-sm text-cozm-muted mb-6">Posted worker equal pay assessment</p>
    <input id="passwordInput" type="password" class="input-field mb-4" placeholder="Enter password" onkeydown="if(event.key==='Enter')attemptLogin()">
    <div id="loginError" class="text-xs text-cozm-danger mb-3 hidden">Incorrect password</div>
    <button onclick="attemptLogin()" class="btn-primary w-full">Enter</button>
    <p class="text-xs text-cozm-muted mt-4">Switzerland &middot; France &middot; Spain</p>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="appScreen" class="hidden min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between no-print">
    <div class="flex items-center gap-3">
      <img id="appLogo" alt="The Cozm" style="height:32px;">
      <span class="text-base font-bold text-cozm-ink">Equal Pay</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="resetApp()" class="text-sm text-cozm-muted hover:text-cozm-teal">New Assessment</button>
      <button onclick="logout()" class="text-sm text-cozm-danger">Logout</button>
    </div>
  </header>

  <!-- Dashboard -->
  <div id="dashboardView" class="max-w-4xl mx-auto px-4 py-8 fade-in">
    <h2 class="text-2xl font-bold text-cozm-ink mb-2">Equal Pay Assessments</h2>
    <p class="text-sm text-cozm-muted mb-6">Compare home remuneration with host-country entitlements for posted workers</p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <button onclick="startNewAssessment('CH')" class="card hover:border-cozm-teal transition-colors text-left group">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl">&#127464;&#127469;</span>
          <span class="font-bold text-cozm-ink group-hover:text-cozm-teal">Switzerland</span>
        </div>
        <p class="text-xs text-cozm-muted">EntsG, GAVs, cantonal minimums</p>
      </button>
      <button onclick="startNewAssessment('FR')" class="card hover:border-cozm-teal transition-colors text-left group">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl">&#127467;&#127479;</span>
          <span class="font-bold text-cozm-ink group-hover:text-cozm-teal">France</span>
        </div>
        <p class="text-xs text-cozm-muted">Code du travail, SMIC, CCNs</p>
      </button>
      <button onclick="startNewAssessment('ES')" class="card hover:border-cozm-teal transition-colors text-left group">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl">&#127466;&#127480;</span>
          <span class="font-bold text-cozm-ink group-hover:text-cozm-teal">Spain</span>
        </div>
        <p class="text-xs text-cozm-muted">Ley 45/1999, SMI, convenios</p>
      </button>
    </div>
    <!-- Saved assessments -->
    <div id="savedAssessments"></div>
  </div>

  <!-- Wizard -->
  <div id="wizardView" class="hidden max-w-3xl mx-auto px-4 py-6 fade-in">
    <!-- Step indicator -->
    <div class="flex items-center mb-8 no-print" id="stepIndicator"></div>

    <!-- Step panels -->
    <div id="stepPanels"></div>

    <!-- Navigation -->
    <div class="flex justify-between mt-6 no-print">
      <button id="btnPrev" onclick="prevStep()" class="btn-secondary">Back</button>
      <button id="btnNext" onclick="nextStep()" class="btn-primary">Continue</button>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsView" class="hidden max-w-4xl mx-auto px-4 py-6 fade-in">
    <div id="resultsContent"></div>
    <div class="flex gap-3 mt-6 no-print">
      <button onclick="generatePayrollPDF()" class="btn-primary">Download Payroll Instructions (PDF)</button>
      <button onclick="generateLetterPDF()" class="btn-primary">Download Assignment Letter (PDF)</button>
      <button onclick="showDashboard()" class="btn-secondary">Back to Dashboard</button>
    </div>
  </div>
</div>

// ===== INITIALISATION =====
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginLogo').src = LOGO_B64;
  document.getElementById('appLogo').src = LOGO_B64;
  loadSavedFromStorage();
  if (sessionStorage.getItem('cozm_ep_auth') === '1') {
    state.loggedIn = true;
    showApp();
  }
});

function attemptLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (pw === SITE_PASSWORD) {
    state.loggedIn = true;
    sessionStorage.setItem('cozm_ep_auth', '1');
    showApp();
  } else {
    document.getElementById('loginError').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

function logout() {
  sessionStorage.removeItem('cozm_ep_auth');
  state.loggedIn = false;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').classList.add('hidden');
}

function showApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  showDashboard();
}

function showDashboard() {
  document.getElementById('dashboardView').classList.remove('hidden');
  document.getElementById('wizardView').classList.add('hidden');
  document.getElementById('resultsView').classList.add('hidden');
  renderSavedAssessments();
}

function loadSavedFromStorage() {
  try {
    state.saved = JSON.parse(localStorage.getItem('cozm_ep_saved') || '[]');
  } catch(e) { state.saved = []; }
}

function saveCurrent(result) {
  const entry = {
    id: 'EP-' + Date.now().toString(36).toUpperCase(),
    date: new Date().toISOString(),
    country: state.country,
    employee: state.form.employeeName || 'Unnamed',
    employer: state.form.homeEmployer || '',
    uplift: result.uplift,
    currency: COUNTRY_DATA[state.country].currency,
    form: { ...state.form },
    result: result
  };
  state.saved.unshift(entry);
  localStorage.setItem('cozm_ep_saved', JSON.stringify(state.saved));
  return entry;
}

function renderSavedAssessments() {
  const container = document.getElementById('savedAssessments');
  if (state.saved.length === 0) {
    container.innerHTML = '<p class="text-sm text-cozm-muted">No saved assessments yet. Select a country above to begin.</p>';
    return;
  }
  container.innerHTML = `
    <h3 class="text-lg font-bold text-cozm-ink mb-4">Recent Assessments</h3>
    <div class="space-y-2">
      ${state.saved.slice(0, 10).map(s => `
        <div class="card flex items-center justify-between cursor-pointer hover:border-cozm-teal transition-colors" onclick="loadSaved('${s.id}')">
          <div class="flex items-center gap-3">
            <span class="text-lg">${COUNTRY_DATA[s.country]?.flag || ''}</span>
            <div>
              <span class="font-semibold text-sm text-cozm-ink">${s.id}</span>

          </div>

            <div class="text-sm font-bold ${s.uplift > 0 ? 'text-cozm-danger' : 'text-cozm-success'}">${s.uplift > 0 ? '+' : ''}${formatCurrency(s.uplift, s.currency)} uplift</div>

        </div>
      `).join('')}

}

function loadSaved(id) {
  const entry = state.saved.find(s => s.id === id);

  state.country = entry.country;

}

  const container = document.getElementById('stepIndicator');

  STEPS.forEach((s, i) => {
    const cls = i < state.currentStep ? 'done' : i === state.currentStep ? 'active' : 'pending';

      html += `<div class="step-line ${i < state.currentStep ? 'done' : 'pending'}"></div>`;

  });
  container.innerHTML = html;
  document.getElementById('btnPrev').style.visibility = state.currentStep === 0 ? 'hidden' : 'visible';

function setField(field, value) {
  state.form[field] = value;
}

function calcDays() {
  if (state.form.startDate && state.form.endDate) {
    const start = new Date(state.form.startDate);
    const end = new Date(state.form.endDate);
    let days = 0;
    const cur = new Date(start);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) days++;
      cur.setDate(cur.getDate() + 1);
    }
    state.form.assignmentDays = days;
    return days + ' working days';
  }
  return 'Enter dates above';
}

function getAgreementName() {
  const cd = COUNTRY_DATA[state.country];
  const a = cd.agreements.find(a => a.id === state.form.agreementId);
  return a ? a.name : 'Not selected';
}

function getAgreementRate() {
  const cd = COUNTRY_DATA[state.country];
  const a = cd.agreements.find(a => a.id === state.form.agreementId);
  return a ? a.minHourly : 0;
}

function prevStep() {
  if (state.currentStep > 0) {
    state.currentStep--;
    renderStep();
  }
}

function validateStep() {
  const f = state.form;
  switch (state.currentStep) {
    case 0: if (!f.startDate || !f.endDate) return 'Please enter assignment start and end dates.'; break;
    case 1: if (!f.employeeName) return 'Please enter the employee name.'; break;
    case 2: if (!f.baseSalaryAnnual) return 'Please enter the annual base salary.'; break;
    case 3: if (!f.agreementId) return 'Please select an applicable agreement.'; break;
  }
  return null;
}

function nextStep() {
  const err = validateStep();
  if (err) { alert(err); return; }
  if (state.currentStep < STEPS.length - 1) {
    state.currentStep++;
    renderStep();
  } else {
    runCalculation();
  }
}

// ===== CALCULATION ENGINE =====
function calculatePreview() {
  const warnings = [];
  const f = state.form;
  if (!f.baseSalaryAnnual) warnings.push('Base salary not entered');
  if (!f.agreementId) warnings.push('No host agreement selected');
  if (!f.assignmentDays && !f.startDate) warnings.push('Assignment dates or days required');
  if (!f.employeeName) warnings.push('Employee name not entered');
  if (f.assignmentAllowance && !f.assignmentAllowanceExpensePortion) {
    warnings.push('Assignment allowance has no documented expense portion - entire amount counted as remuneration');
  }
  return { warnings };
}

function getExchangeRate(fromCurrency, toCurrency) {
  if (fromCurrency === toCurrency) return { rate: 1, source: 'Same currency', date: '' };
  const cd = COUNTRY_DATA[state.country];
  // Simplified exchange rates for demo
  const rates = {
    'GBP_EUR': 1.17, 'EUR_GBP': 1/1.17,
    'GBP_CHF': 1.11, 'CHF_GBP': 1/1.11,
    'EUR_CHF': 0.94, 'CHF_EUR': 1/0.94,
    'USD_EUR': 0.92, 'EUR_USD': 1/0.92,
    'USD_CHF': 0.87, 'CHF_USD': 1/0.87,
    'GBP_USD': 1.27, 'USD_GBP': 1/1.27,
  };
  const key = `${fromCurrency}_${toCurrency}`;
  return {
    rate: rates[key] || 1,
    source: state.country === 'CH' ? 'ESTV official rate' : 'ECB reference rate',
    date: '2025-01-01'
  };
}

function runCalculation() {
  const f = state.form;
  const cd = COUNTRY_DATA[state.country];
  const agreement = cd.agreements.find(a => a.id === f.agreementId);
  const hostCurrency = cd.currency;

  // Calculate assignment days
  let assignmentDays = f.assignmentDays;
  if (!assignmentDays && f.startDate && f.endDate) {
    const start = new Date(f.startDate);
    const end = new Date(f.endDate);
    assignmentDays = 0;
    const cur = new Date(start);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) assignmentDays++;
      cur.setDate(cur.getDate() + 1);
    }
  }
  if (!assignmentDays) assignmentDays = 1;

  const hoursPerDay = f.scheduledHoursPerWeek / 5;
  const totalScheduledHours = assignmentDays * hoursPerDay;

  // === HOME REMUNERATION (normalised to hourly) ===
  const annualWorkingHours = f.homeWeeklyHours * 52;
  const homeHourlyBase = (f.baseSalaryAnnual || 0) / annualWorkingHours;

  // Include 13th/14th as pro-rated
  const home13thHourly = (f.bonuses13th || 0) / annualWorkingHours;
  const home14thHourly = (f.bonuses14th || 0) / annualWorkingHours;
  const homeHolidayPayHourly = (f.holidayPayRate || 0) / annualWorkingHours;
  const homeOtherHourly = (f.otherAllowances || 0) / annualWorkingHours;

  // Assignment allowance: remuneration portion only
  const assignmentAllowanceRem = (f.assignmentAllowance || 0) - (f.assignmentAllowanceExpensePortion || 0);
  const homeAssignAllowHourly = totalScheduledHours > 0 ? assignmentAllowanceRem / totalScheduledHours : 0;

  const totalHomeHourlyHomeCurrency = homeHourlyBase + home13thHourly + home14thHourly + homeHolidayPayHourly + homeOtherHourly + homeAssignAllowHourly;

  // Convert to host currency
  const fx = getExchangeRate(f.homeCurrency, hostCurrency);
  const totalHomeHourlyHostCurrency = totalHomeHourlyHomeCurrency * fx.rate;

  // === HOST ENTITLEMENT ===
  const hostMinHourly = agreement ? agreement.minHourly : 0;

  // Grade multipliers (simplified demo)
  const gradeMultiplier = { entry: 1.0, standard: 1.0, senior: 1.10, manager: 1.20 }[f.grade] || 1.0;
  // Experience supplement (1% per year, capped at 15%)
  const expMultiplier = 1 + Math.min(f.experience * 0.01, 0.15);

  const adjustedHostHourly = hostMinHourly * gradeMultiplier * expMultiplier;

  // Calculate host entitlement components
  // Overtime/night/Sunday/holiday hours are additional to scheduled hours,
  // so we pay full multiplied rate (base + supplement) for those hours
  const hostBaseForPeriod = adjustedHostHourly * totalScheduledHours;
  const hostOvertimePay = (f.overtimeHours || 0) * adjustedHostHourly * (cd.overtimeRate - 1);
  const hostNightPay = (f.nightHours || 0) * adjustedHostHourly * (cd.nightRate - 1);
  const hostSundayPay = (f.sundayHours || 0) * adjustedHostHourly * (cd.sundayRate - 1);
  const hostHolidayPay = (f.publicHolidayHours || 0) * adjustedHostHourly * (cd.holidayRate - 1);

  // 13th/14th month pro-rating for host
  let host13thPay = 0;
  let host14thPay = 0;
  const weeklyHrs = f.scheduledHoursPerWeek || cd.maxWeeklyHours;
  if (state.country === 'ES' && cd.pagas) {
    // Spain: 2 pagas extraordinarias pro-rated
    const yearFraction = assignmentDays / cd.workingDays;
    host13thPay = (adjustedHostHourly * weeklyHrs * 52 / 12) * yearFraction;
    host14thPay = host13thPay;
  }
  // France: no statutory 13th month, but some CCNs include it
  if (state.country === 'FR' && (f.agreementId === 'fr-metallurgy' || f.agreementId === 'fr-syntec')) {
    const yearFraction = assignmentDays / cd.workingDays;
    host13thPay = (adjustedHostHourly * weeklyHrs * 52 / 12) * yearFraction;
  }
  // Switzerland: typically in GAV
  if (state.country === 'CH' && (f.agreementId === 'ch-gav-bau' || f.agreementId === 'ch-gav-maler')) {
    const yearFraction = assignmentDays / cd.workingDays;
    host13thPay = (adjustedHostHourly * weeklyHrs * 52 / 12) * yearFraction;
  }

  // Holiday pay entitlement
  const annualLeaveProRated = cd.minAnnualLeave * (assignmentDays / cd.workingDays);
  const hostHolidayPayEntitlement = annualLeaveProRated * hoursPerDay * adjustedHostHourly;

  const totalHostEntitlement = hostBaseForPeriod + hostOvertimePay + hostNightPay + hostSundayPay + hostHolidayPay + host13thPay + host14thPay + hostHolidayPayEntitlement;

  // === COMPARISON ===
  const totalHomeForPeriod = totalHomeHourlyHostCurrency * totalScheduledHours;
  const shortfall = totalHostEntitlement - totalHomeForPeriod;
  const uplift = Math.max(0, shortfall);
  const upliftPerHour = totalScheduledHours > 0 ? uplift / totalScheduledHours : 0;
  const upliftPerDay = assignmentDays > 0 ? uplift / assignmentDays : 0;

  // Convert uplift to payroll currency
  const fxBack = getExchangeRate(hostCurrency, f.homeCurrency);
  const upliftPayrollCurrency = uplift * fxBack.rate;

  // Applicability check
  let applicability = 'required';
  let applicabilityReason = 'The assignment involves productive services in the host country, triggering equal pay comparison obligations.';
  if (f.assignmentType === 'business_travel' && (f.assignmentPurpose === 'meeting' || f.assignmentPurpose === 'training')) {
    if (assignmentDays <= 5) {
      applicability = 'not_triggered';
      applicabilityReason = 'Short-term business travel for meetings/training without productive service provision does not typically trigger equal pay obligations.';
    }
  }

  const result = {
    applicability,
    applicabilityReason,
    country: state.country,
    countryName: cd.name,
    legalBasis: cd.legalBasis,
    agreement: agreement ? agreement.name : 'None selected',
    agreementId: f.agreementId,
    effectiveFrom: agreement ? agreement.effectiveFrom : '',
    hostCurrency,
    homeCurrency: f.homeCurrency,
    exchangeRate: fx.rate,
    exchangeRateSource: fx.source,
    exchangeRateDate: fx.date,
    // Home
    homeHourlyBase,
    home13thHourly,
    home14thHourly,
    homeHolidayPayHourly,
    homeOtherHourly,
    homeAssignAllowHourly,
    totalHomeHourlyHomeCurrency,
    totalHomeHourlyHostCurrency,
    totalHomeForPeriod,
    // Host
    hostMinHourly,
    adjustedHostHourly,
    gradeMultiplier,
    expMultiplier,
    hostBaseForPeriod,
    hostOvertimePay,
    hostNightPay,
    hostSundayPay,
    hostHolidayPay,
    host13thPay,
    host14thPay,
    hostHolidayPayEntitlement,
    totalHostEntitlement,
    // Comparison
    shortfall,
    uplift,
    upliftPerHour,
    upliftPerDay,
    upliftPayrollCurrency,
    // Time
    assignmentDays,
    totalScheduledHours,
    hoursPerDay,
    // Terms
    terms: cd.terms,
    timestamp: new Date().toISOString()
  };

  const saved = saveCurrent(result);
  result.caseId = saved.id;
  showResults(result);
}

function compRow(label, home, host) {
  const diff = host - home;
  return `
    <tr class="border-b border-gray-100">
      <td class="py-1.5 text-xs">${label}</td>
      <td class="py-1.5 text-right text-xs">${formatCurrency(home, '')}</td>
      <td class="py-1.5 text-right text-xs">${formatCurrency(host, '')}</td>
      <td class="py-1.5 text-right text-xs ${diff > 0 ? 'text-cozm-danger' : diff < 0 ? 'text-cozm-success' : ''}">${diff !== 0 ? (diff > 0 ? '+' : '') + formatCurrency(diff, '') : '-'}</td>
    </tr>
  `;
}

function formatTermKey(key) {
  return key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatCurrency(amount, currency) {
  if (amount === undefined || amount === null || amount === '' || isNaN(amount)) return '-';
  const num = parseFloat(amount);
  const formatted = num.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return currency ? `${currency} ${formatted}` : formatted;
}

  doc.text(`International Assignment to ${r.countryName}`, margin, y);
  y += 4;
  doc.setFontSize(8);
  doc.setTextColor(93, 111, 117);
  doc.text(`${r.caseId || ''} | ${new Date(r.timestamp).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`, margin, y);
  y += 8;

  doc.setDrawColor(68, 145, 156);
  doc.setLineWidth(0.5);
  doc.line(margin, y, pageW - margin, y);
  y += 8;

  function addSection(title, content) {
    if (y > 255) { doc.addPage(); y = 20; }
    doc.setFontSize(10);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(68, 145, 156);
    doc.text(title, margin, y);
    y += 5;
    doc.setFontSize(9);
    doc.setFont(undefined, 'normal');
    doc.setTextColor(29, 54, 66);
    const lines = doc.splitTextToSize(content, contentW);
    lines.forEach(line => {
      if (y > 275) { doc.addPage(); y = 20; }
      doc.text(line, margin, y);
      y += 4.2;
    });
    y += 3;
  }

  // Letter content
  addSection('1. Parties',
    `This assignment letter confirms the terms of the international assignment of ${f.employeeName || '[Employee]'} ("the Employee"), employed by ${f.homeEmployer || '[Employer]'} ("the Employer"), to ${r.countryName}. The Employee's existing contract of employment remains in force throughout the assignment.`
  );

  addSection('2. Assignment Details',
    `Purpose: ${f.assignmentPurpose || 'Service provision'}\nStart date: ${f.startDate || '[Date]'}\nEnd date: ${f.endDate || '[Date]'}\nWorksite: ${f.worksite || '[Location]'}\nThe Employee shall remain under the direction of the Employer. This assignment does not transfer the employment relationship to any host entity.`
  );

  addSection('3. Duties and Classification',
    `Job title: ${f.jobTitle || '[Title]'}\nGrade: ${f.grade}\nThe Employee shall perform their normal duties as required at the assignment location. The applicable host-country classification is determined by the ${r.agreement}.`
  );

  addSection('4. Remuneration',
    `The Employee's home salary of ${formatCurrency(f.baseSalaryAnnual, f.homeCurrency)} per annum shall continue. ${r.uplift > 0 ? `An Equal Pay Assignment Allowance of ${formatCurrency(r.upliftPayrollCurrency, f.homeCurrency)} (equivalent to ${formatCurrency(r.uplift, r.hostCurrency)}) shall be paid for the assignment period to ensure compliance with host-country minimum remuneration requirements under ${r.legalBasis}. This allowance is calculated as a separate gross payment and shall appear on the payslip as "Equal Pay Assignment Allowance - ${r.countryName}".` : 'The Employee\'s home remuneration meets or exceeds the host-country entitlement; no equal pay uplift is required.'}\n\nExpense reimbursements for travel, accommodation and meals shall remain separate from remuneration and shall not reduce any equal pay entitlement.`
  );

  addSection('5. Working Time',
    `Normal working hours: ${f.scheduledHoursPerWeek} hours per week.\nMaximum daily hours: ${r.terms.maxDailyHours}.\nMinimum daily rest: ${r.terms.minDailyRest}.\nMinimum weekly rest: ${r.terms.minWeeklyRest}.\nBreaks: ${r.terms.breaks}.\nOvertime shall be approved in advance and compensated at the rates prescribed by the applicable agreement or statute.`
  );

  addSection('6. Night, Weekend and Public Holiday Work',
    `Night work: ${r.terms.nightWork}.\nSunday/weekend work: ${r.terms.sundayWork}.\nWork on public holidays shall be compensated in accordance with the applicable agreement.`
  );

  addSection('7. Leave Entitlements',
    `Annual leave: The Employee is entitled to a minimum of ${COUNTRY_DATA[r.country].minAnnualLeave} working days of paid annual leave per year (pro-rated for the assignment period).\nPublic holidays: ${COUNTRY_DATA[r.country].publicHolidays} public holidays per year in ${r.countryName}.\nSickness: ${r.terms.sickLeave}.`
  );

  addSection('8. Family-Related Leave',
    `Maternity leave: ${r.terms.maternityLeave}.\nPaternity leave: ${r.terms.paternityLeave}.\nThe Employee shall be entitled to family-related leave in accordance with the more favourable of the home or host-country provisions.`
  );

  addSection('9. Health, Safety and Equal Treatment',
    `The Employee shall comply with all host-country health and safety regulations, site rules and required training. The Employer shall provide any necessary personal protective equipment.\nEqual treatment: ${r.terms.equalTreatment}.`
  );

  addSection('10. Social Security and Immigration',
    `The Employer shall arrange for the appropriate social security coordination document (A1 certificate or equivalent) before the assignment commences. The Employee must hold valid work authorisation for ${r.countryName} throughout the assignment. The Employer shall file any required posting notification with the host-country authorities.`
  );

  addSection('11. Tax',
    `The Employee shall cooperate with the Employer on tax-compliance obligations arising from the assignment. This letter does not constitute tax advice and does not determine the Employee's tax residence or liability.`
  );

  addSection('12. Travel, Accommodation and Expenses',
    `The Employer shall provide or reimburse reasonable travel, accommodation, meal and local transport expenses in accordance with the company policy. Expense reimbursements are separate from remuneration.`
  );

  addSection('13. Confidentiality and Data Protection',
    `The Employee shall maintain confidentiality of proprietary information. Personal data shall be processed in accordance with applicable data protection legislation, including the GDPR where applicable.`
  );

  addSection('14. Early Termination and Recall',
    `The Employer may terminate or curtail the assignment with reasonable notice. The Employee shall be entitled to repatriation assistance. Any equal pay allowance shall be adjusted pro rata.`
  );

  addSection('15. Governing Law',
    `This assignment letter is governed by the law of the home country, subject to the mandatory protections of ${r.countryName} law that are more favourable to the Employee, as required by ${r.legalBasis}.`
  );

  // Signature block
  if (y > 240) { doc.addPage(); y = 20; }
  y += 10;
  doc.setFontSize(9);
  doc.setTextColor(29, 54, 66);
  doc.text('Signed for and on behalf of the Employer:', margin, y);
  y += 15;
  doc.line(margin, y, margin + 60, y);
  doc.text('Name:', margin, y + 5);
  doc.text('Date:', margin, y + 10);
  y += 20;
  doc.text('Signed by the Employee:', margin, y);
  y += 15;
  doc.line(margin, y, margin + 60, y);
  doc.text('Name:', margin, y + 5);
  doc.text('Date:', margin, y + 10);

  // Footer on last page
  const pageCount = doc.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(7);
    doc.setTextColor(93, 111, 117);
    doc.text(`Generated by Cozm Equal Pay | ${r.caseId || ''} | Page ${i} of ${pageCount}`, margin, 290);
  }

  doc.save(`Assignment-Letter-${r.countryName}-${r.caseId || 'draft'}.pdf`);
}
</script>

</body>
</html>
